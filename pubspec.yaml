name: home_widget
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.10.0 <4.0.0"

#=====================================================================
#               앱 실행에 필요한 런타임 패키지 (Dependencies)
#=====================================================================
dependencies:
  flutter:
    sdk: flutter

  #== Core Architecture: 상태관리, 라우팅, 의존성 주입 ==#
  flutter_bloc: ^9.1.1
  go_router: ^17.1.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4

  #== Networking & API: HTTP 통신, API 클라이언트, 데이터 모델 ==#
  dio: ^5.9.2
  retrofit: ^4.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  # equatable: ^2.0.8

  #== Firebase & Push Notifications ==#
  # firebase_core: ^4.5.0
  # firebase_auth: ^6.2.0
