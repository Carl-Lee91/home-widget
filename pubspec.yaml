#=====================================================================
#               개발 과정에서만 필요한 패키지 (Dev Dependencies)
#=====================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  #== Code Generation: 코드 자동 생성을 위한 도구들 ==#
  build_runner: ^2.12.1
  injectable_generator: ^2.12.1
  retrofit_generator: ^10.2.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

  #== App Branding: 스플래시 화면 및 앱 아이콘 설정 ==#
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

  #== Testing: BLoC 테스트 및 Mock 객체 생성 ==#
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

dependency_overrides:
  test_api: ^0.7.6

